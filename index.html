<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dati produttivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#17212B; --muted:#566574;
  --line:#D8DEE4; --green:#1C2630; --green-dark:#2F3F50; --amber:#E3B23C;
  --danger:#B3261E; --danger-bg:#FDE7E6; --link:#2F5D8A; --head:#F6F8FA; --ok:#1E7A47; --ok-bg:#E6F4EC;
  --warn-bg:#FFF1C2; --warn:#8A5A00; --side:#1C2630; --radius:8px; --calc:#F3F6F9; --mp:#F7FAFD; --pf:#FBFAF5;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;}
[hidden]{display:none !important;}
.app{display:flex;min-height:100vh;}
.side{flex:0 0 210px;background:var(--side);color:#DCE3EA;padding:26px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;}
.side h1{font-size:1.6rem;margin:0;color:#fff;font-weight:600;}
.side .sub{margin:4px 0 0;font-size:.8rem;color:#A9B8C6;}
.tabs{display:flex;flex-direction:column;gap:3px;}
.tabs .sep{height:1px;background:#34414F;margin:10px 4px;}
.tab-btn{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 13px;border-radius:6px;border:0;background:none;color:#DCE3EA;font:inherit;font-size:1rem;font-weight:500;cursor:pointer;}
.tab-btn:hover{background:rgba(255,255,255,.08);}
.tab-btn.active{background:var(--amber);color:#1C2630;font-weight:700;}
.tab-btn .cnt{font-size:.75rem;opacity:.75;font-weight:600;}
.tab-btn .dot{width:8px;height:8px;border-radius:50%;background:#FF7A80;display:inline-block;}
.side-foot{margin-top:auto;font-size:.8rem;color:#A9B8C6;display:flex;flex-direction:column;gap:8px;}
.side-foot button{background:none;border:1px solid #4A5A69;color:#DCE3EA;padding:7px 12px;font:inherit;font-size:.8rem;border-radius:6px;cursor:pointer;}
.side-foot button:hover{border-color:var(--amber);color:var(--amber);}
.demo-badge{background:var(--amber);color:#1C2630;border-radius:6px;padding:6px 9px;font-weight:600;line-height:1.3;}

.main-area{flex:1 1 auto;min-width:0;padding:0 24px 60px;}
.daybar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px;}
.daybar label{font-weight:600;}
.data-box{position:relative;display:inline-flex;align-items:center;border:2px solid var(--amber);border-radius:6px;background:var(--panel);}
.data-box #g-data-txt{font:inherit;font-size:1.1rem;font-weight:600;padding:7px 4px 7px 10px;border:0;width:130px;background:transparent;color:var(--ink);outline:none;}
.data-box #g-cal{border:0;background:none;cursor:pointer;padding:6px 10px;color:var(--muted);display:flex;}
.data-box #g-cal:hover{color:var(--ink);}
.data-box #g-data{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;}
.daybar input[type=date]{font:inherit;font-size:1.1rem;padding:7px 10px;border:2px solid var(--amber);border-radius:6px;background:var(--panel);color:var(--ink);font-weight:600;}
.stato{font-size:.85rem;padding:5px 10px;border-radius:20px;font-weight:600;}
.stato.ok{background:var(--ok-bg);color:var(--ok);}
.stato.mod{background:var(--warn-bg);color:var(--warn);}
.stato.new{background:#E7EEF6;color:var(--link);}
.stato.bz{background:#EDE7F6;color:#5B3E96;}
.daybar .spacer{flex:1;}
.btn{border:0;border-radius:6px;background:var(--green);color:#fff;font:inherit;font-weight:600;font-size:.92rem;padding:9px 16px;cursor:pointer;}
.btn:hover{background:var(--green-dark);}
.btn.amber{background:var(--amber);color:#1C2630;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:var(--link);color:var(--link);}
.btn.danger{background:var(--danger);}
.btn.sm{padding:6px 11px;font-size:.82rem;}
.btn:disabled{opacity:.55;cursor:wait;}

.view{display:none;}
.view.active{display:block;}
.page-title{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:0 0 14px;}
.page-title h2{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:.01em;}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.9rem;}
.pill b{font-size:1.05rem;font-variant-numeric:tabular-nums;}
.pill.neg{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
.pill.neg input{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger);}
.pill input{font:inherit;font-weight:700;width:90px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;text-transform:uppercase;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;}
.toolbar input[type=search],.toolbar input[type=text]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;min-width:260px;background:var(--panel);}
.toolbar .info{color:var(--muted);font-size:.85rem;}
.toolbar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);}

.sheet-wrap{background:var(--panel);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);}
table{border-collapse:collapse;font-size:1rem;font-variant-numeric:tabular-nums;}
.sheet th{background:var(--head);color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.15;padding:8px 6px;border:1px solid var(--line);position:sticky;z-index:3;text-align:center;}
.sheet thead tr.g th{top:0;font-size:.86rem;color:var(--ink);font-weight:700;letter-spacing:.03em;}
.sheet thead tr.h th{top:31px;}
.sheet td{border:1px solid var(--line);padding:0;height:37px;}
.sheet td.n{background:var(--head);color:var(--muted);text-align:center;font-size:.88rem;width:42px;min-width:42px;font-weight:600;}
.sheet td.mp{background:var(--mp);}
.sheet td.pf{background:var(--pf);}
.sheet input{border:0;background:transparent;width:100%;height:37px;padding:0 7px;font:inherit;font-size:1rem;color:var(--ink);outline:none;}
.sheet input:focus{background:#EAF2FB;box-shadow:inset 0 0 0 2px var(--link);}
.sheet td.r input{text-align:right;}
.sheet td.c input{text-align:center;}
.sheet td.up input{text-transform:uppercase;}
.sheet td.err{background:var(--danger-bg) !important;box-shadow:inset 0 0 0 2px var(--danger);}
.sheet tr.vietato td{background:#F8B4B4 !important;}
.sheet tr.vietato td.n{background:var(--danger) !important;color:#fff;}
.sheet td.auto{background:#E6F4EC !important;transition:background .4s;}
.sheet td.rosso{background:#FF9999 !important;}
.sheet td.rosso input{font-weight:700;}
.legend .lr::before{background:#FF9999;}
.legend .lv::before{background:#F8B4B4;box-shadow:inset 3px 0 0 var(--danger);}
.sheet td.warn{background:var(--warn-bg) !important;box-shadow:inset 0 0 0 2px #E3B23C;}
.sheet td.calc[data-f=lottoPF]{text-align:center;color:var(--ink);font-weight:500;}
.sheet td.calc{background:var(--calc);text-align:right;padding:0 8px;font-weight:600;color:var(--muted);white-space:nowrap;}
.sheet td.calc.neg{color:var(--danger);background:var(--danger-bg);}
.sheet td.calc.zero{color:var(--ok);}
.sheet td.chk{text-align:center;cursor:pointer;user-select:none;font-weight:700;font-size:1rem;width:44px;}
.sheet td.chk:hover{background:#FFFBEA;}
.sheet tfoot td{background:var(--head);font-weight:700;text-align:right;padding:0 8px;height:32px;border-top:2px solid #AEB8C2;white-space:nowrap;}
.sheet tfoot td.lbl{text-align:left;color:var(--muted);}
.sheet tr.hide{display:none;}
.sheet td.sepcol{width:6px;min-width:6px;padding:0;background:#AEB8C2;border:0;}
.addrow{margin:10px 0 0;display:flex;gap:10px;align-items:center;}
.sheet tbody td.n.on{background:#1F6FEB !important;color:#fff !important;font-size:.95rem;box-shadow:inset 0 0 0 1px #1F6FEB;}
.sheet td.sel{background-image:linear-gradient(rgba(31,111,235,.20),rgba(31,111,235,.20));outline:2px solid #1F6FEB;outline-offset:-2px;}
.sheet.selmode{user-select:none;-webkit-user-select:none;cursor:cell;}
.sheet.selmode input{pointer-events:none;}
.selsum{position:fixed;z-index:190;background:#1F2A37;color:#fff;font-size:.84rem;padding:7px 11px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap;}
.selsum b{font-size:.98rem;margin-left:3px;}
.selsum span{opacity:.75;margin-left:10px;}
.tip{position:fixed;z-index:200;background:var(--danger);color:#fff;font-size:.8rem;font-weight:600;padding:6px 9px;border-radius:5px;max-width:320px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.tip.w{background:#8A5A00;}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;}
.legend .le::before{background:var(--danger-bg);box-shadow:inset 0 0 0 2px var(--danger);}
.legend .lw::before{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #E3B23C;}

.panel{background:var(--panel);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;border:1px solid var(--line);}
.panel h3{margin:0 0 12px;font-size:1.05rem;}
.list th,.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.list th{background:var(--head);color:var(--muted);font-size:.76rem;font-weight:600;position:sticky;top:0;z-index:2;}
.list td.r,.list th.r{text-align:right;}
.list th.thf{cursor:pointer;user-select:none;}
.list th.thf:hover{background:#E9EEF3;color:var(--ink);}
.list th.thf .fil{font-size:.7rem;opacity:.45;margin-left:2px;}
.list th.thf .fil.on{opacity:1;color:var(--link);}
.list th.thf.attivo{background:#E7EEF6;color:var(--link);}
.conf-lotto td,.conf-lotto thead tr:last-child th{white-space:nowrap;width:1%;padding-right:22px;}
.conf-lotto td:nth-child(2),.conf-lotto thead tr:last-child th:nth-child(2){width:auto;}
.conf-lotto tr.vai{cursor:pointer;}
.conf-lotto tr.uff td{background:var(--ok-bg);}
.conf-lotto tr.vai:hover td{background:#FFFBEA;}
.filtro-pop{position:absolute;z-index:150;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:270px;padding:10px;font-size:.88rem;}
.filtro-pop .fp-tit{font-weight:700;margin:0 0 6px 2px;}
.filtro-pop .fp-op{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:6px 6px;border-radius:5px;cursor:pointer;color:var(--ink);}
.filtro-pop .fp-op:hover{background:var(--head);}
.filtro-pop .fp-cerca{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;margin:6px 0;}
.filtro-pop .fp-lista{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:4px 0;}
.filtro-pop .fp-v{display:flex;gap:6px;align-items:center;padding:3px 8px;cursor:pointer;}
.filtro-pop .fp-v:hover{background:var(--head);}
.filtro-pop .fp-v i{margin-left:auto;color:var(--muted);font-style:normal;font-size:.78rem;}
.filtro-pop .fp-tutti{font-weight:600;}
.filtro-pop .fp-btn{display:flex;gap:6px;margin-top:8px;align-items:center;}
.list tfoot td{font-weight:700;background:var(--head);border-top:2px solid #AEB8C2;}
.list tr.tot td{font-weight:700;background:var(--head);}
.list .act{display:flex;gap:6px;}
.list-wrap{overflow:auto;max-height:calc(100vh - 250px);}
.empty{color:var(--muted);padding:26px;text-align:center;}
.subtabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;}
.subtabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:20px;cursor:pointer;color:var(--ink);}
.subtabs button.on{background:var(--side);color:#fff;border-color:var(--side);}
.mesi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;}

.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;}
.modal.show{display:flex;}
.modal-card{background:var(--panel);border-radius:var(--radius);padding:22px 24px;width:100%;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
.modal-card h2{margin:0 0 12px;font-size:1.2rem;}
.modal-card p{margin:0 0 12px;line-height:1.45;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.errlist{max-height:50vh;overflow:auto;margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:6px;}
.errlist li{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.92rem;}
.errlist li:hover{background:var(--head);}
.errlist li b{display:inline-block;min-width:150px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 22px;border-radius:8px;font-weight:600;z-index:130;display:none;}
.toast.show{display:block;}
.toast.err{background:var(--danger);}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side);}
.login-card{background:var(--panel);border-radius:10px;padding:30px 32px;width:340px;}
.login-card h1{margin:0 0 4px;}
.login-card p{margin:0 0 18px;color:var(--muted);}
.login-card input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;}
.login-card .btn{width:100%;padding:11px;}
.login-card .err{color:var(--danger);font-weight:600;font-size:.9rem;min-height:1.2em;}
.prodsel{display:flex;gap:4px;background:#27343F;border-radius:8px;padding:3px;}
.prodsel button{flex:1;border:0;background:none;color:#DCE3EA;font:inherit;font-weight:600;font-size:.86rem;padding:7px 4px;border-radius:6px;cursor:pointer;}
.prodsel button.on{background:var(--amber);color:#1C2630;}
.side h1 small{display:block;font-size:.78rem;color:#A9B8C6;font-weight:500;margin-top:2px;}
.tab-btn.gp-only,.tab-btn.pr-only{}
.nav-title{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#7F90A1;margin:12px 6px 2px;}
.sheet td.ro{background:var(--calc);padding:0 8px;text-align:right;white-space:nowrap;color:var(--ink);}
.sheet td.ro.l{text-align:left;}
.sheet td.ro.c{text-align:center;}
.sheet td.ro.neg{color:var(--danger);}
.sheet td.edited input{font-weight:700;}
.sheet td.cur-r input{background:#FFF8DC;}
.sheet tr.attiva td.n{background:#1F6FEB;color:#fff;}
.sheet .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;width:100%;height:37px;}
.sheet .del:hover{color:var(--danger);}
.sheet.tab-ro td{padding:0 9px;height:35px;white-space:nowrap;}
.sheet.tab-ro td.r{text-align:right;}
.sheet.tab-ro td.c{text-align:center;}
.sheet.tab-ro td.cur{outline:2px solid #1F6FEB;outline-offset:-2px;}
.sheet.tab-ro td.sel{background-image:linear-gradient(rgba(31,111,235,.20),rgba(31,111,235,.20));}
.sheet.tab-ro tr.sepm td{border-top:2px solid #AEB8C2;}
.sheet.tab-ro tr:hover td:not(.sel){background:#FAFCFE;}
.sheet.tab-ro th{cursor:pointer;user-select:none;}
.sheet.tab-ro th:hover{background:#E9EEF3;color:var(--ink);}
.sheet.tab-ro th.on{background:#E7EEF6;color:var(--link);}
.sheet.tab-ro th .ar{font-size:.68rem;margin-left:3px;}
.sheet.tab-ro{outline:none;}
.fb{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap;align-items:center;}
.fb .btn{padding:7px 12px;font-size:.84rem;}
.mesenav{display:inline-flex;align-items:center;gap:6px;}
.mesenav button{border:1px solid var(--line);background:var(--panel);border-radius:6px;font:inherit;font-weight:700;padding:6px 11px;cursor:pointer;}
.mesenav b{min-width:140px;text-align:center;font-size:1.05rem;}
.big{font-size:1.1rem;font-weight:700;}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px;}
.kpi .pill b{font-variant-numeric:tabular-nums;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;}
.formrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:0 0 12px;}
.formrow label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px;font-weight:600;}
.formrow input,.formrow select{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);}
.note{font-size:.84rem;color:var(--muted);line-height:1.4;}
.okbox{background:var(--ok-bg);color:var(--ok);padding:8px 12px;border-radius:6px;font-weight:600;}
.errbox{background:var(--danger-bg);color:var(--danger);padding:8px 12px;border-radius:6px;font-weight:600;}
.fbar{position:fixed;z-index:180;background:#1F2A37;color:#fff;font-size:.85rem;padding:5px 10px;border-radius:5px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.printonly{display:none;}
@media print{
  body{background:#fff;}
  .app,.login,.modal,.toast,.tip,.selsum,.fbar,.filtro-pop{display:none !important;}
  .printonly{display:block !important;}
  #print-area{font-family:Arial,Helvetica,sans-serif;color:#000;}
  #print-area h2{font-size:15pt;margin:0 0 4px;}
  #print-area .psub{font-size:10.5pt;margin:0 0 8px;}
  #print-area table{border-collapse:collapse;width:100%;font-size:10.5pt;}
  #print-area th,#print-area td{border:1px solid #444;padding:3px 5px;}
  #print-area th{background:#e8e8e8;}
  #print-area td.r{text-align:right;}
  #print-area tr.tot td{font-weight:bold;background:#f0f0f0;}
  #print-area.alto tr.tot td{font-size:13pt;font-weight:900;border-top:2px solid #000;}
  #print-area tr{page-break-inside:avoid;}
  #print-area thead{display:table-header-group;}
  #print-area.centra td,#print-area.centra th{text-align:center !important;}
  #print-area.alto table{font-size:12pt;}
  #print-area.alto th,#print-area.alto td{padding:8px 8px;}
}

/* colori codici articolo */
.sheet td[data-cod="MEZZANO"],.sheet td[data-cod="GRAN BON"]{background-color:#FFF0A0!important;}
.sheet td[data-cod="BIO"],.sheet td[data-cod="RETINATO"]{background-color:#C6EBC0!important;}
.sheet td[data-cod="SBIANCATO"]{background-color:#FFD08A!important;}
.sheet td[data-cod="ALTRO"]{background-color:#DCCDF6!important;}
.sheet td[data-cod]{font-weight:600;}
@media print{.sheet td[data-cod]{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}

#foglio-t th.fg{cursor:pointer;}
#foglio-t th.fg:hover{background:#E3EAF2;}
#foglio-t th.fg.on{color:#1F6FEB;}

/* lavorazioni: colonna data (PR giallo, GP verde) e ultima riga di ogni giornata in giallo */
.sheet td[data-dc="PR"]{background-color:#FFE97A!important;font-weight:600;}
.sheet td[data-dc="GP"]{background-color:#B9E6B0!important;font-weight:600;}
.sheet.tab-ro tr.ult td{background-color:#FFF0A0!important;border-bottom:2px solid #D9B600;}
.sheet.tab-ro tr.ult td[data-dc="GP"]{background-color:#B9E6B0!important;}
.sheet.tab-ro tr.ult td[data-dc="PR"]{background-color:#FFE97A!important;}
@media print{.sheet td[data-dc],.sheet tr.ult td{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}

.sheet td.b{font-weight:700;}
.sheet td.negpf{background-color:#FF7F7F!important;color:#5A0000!important;font-weight:700;}
.sheet.tab-ro tr td.negpf,.sheet.tab-ro tr.ult td.negpf,.sheet.tab-ro tr:hover td.negpf{background-color:#FF7F7F!important;color:#5A0000!important;}
.sheet.tab-ro thead th{top:0;}
.sheet thead th{top:0;}
.sheet thead th{z-index:10;}
.sheet td input{position:relative;z-index:0;}
.sheet thead th{transform:translateZ(0);}
.sheet{border-collapse:separate;border-spacing:0;}
.sheet td,.sheet th{border-width:0 1px 1px 0;}
.sheet{width:100%;}
.main-area{padding:0 16px 60px;}

.cs-fit{overflow-x:hidden !important;}
.cs-fit .sheet{width:100% !important;min-width:0 !important;table-layout:auto;}
.cs-fit .sheet th,.cs-fit .sheet td{padding-left:4px !important;padding-right:4px !important;}
.cs-fit .sheet th{white-space:normal;}

<script>
'use strict';
// ====== CONFIGURAZIONE (stesso progetto Supabase del registro lotti, tabelle dp_* separate) ======
const SUPABASE_URL = 'https://jeyaymdllslsssqnovdj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_T3tpl8qpQuMrXoWMj1L1yg_6O-1vJgJ';

// ================================================================================================
const DEMO = FORZA_DEMO || !window.supabase || /[?&]demo\b/.test(location.search);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const MESI_LUNGHI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
const GIORNI = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const PRODOTTI = { PR: 'Parmigiano Reggiano', GP: 'Grana Padano' };

// ---------- formati ----------
const fmtKg = n => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
const fmtKg0 = n => (n == null || n === '' || isNaN(n)) ? '' : Number.isInteger(+n) ? Number(n).toLocaleString('it-IT', { maximumFractionDigits: 0, useGrouping: 'always' }) : Number(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' });
const isoOggi = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const isoToIt = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const meseKey = iso => iso.slice(0, 7);

const fineMese = mk => { const d = new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0); return mk + '-' + String(d.getDate()).padStart(2, '0'); };
const giornoSett = iso => GIORNI[new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)).getDay()];
const vuoto = v => v == null || v === '' || v === false;
const num = v => (v == null || v === '' || isNaN(v)) ? 0 : Number(v);
const mround = x => Math.round(x * 2 + 1e-9) / 2;                       // MROUND(x; 0,5) di Excel
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const normMatr = m => String(m ?? '').trim().toUpperCase().replace(/\s+/g, '');      // PD 707 e PD707 sono la stessa matricola
const confrontaTxt = (a, b) => String(a).localeCompare(String(b), 'it', { numeric: true, sensitivity: 'base' });

// numero: accetta 1.234,5  1234,5  1234.5  e somme (=12+24 oppure 12+24)
function parseNum(s) {
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return null;
  if (!s.startsWith('=') && /^[\d.,]+(\+[\d.,]+)+$/.test(s)) s = '=' + s;
  if (s.startsWith('=')) {
    const e = s.slice(1).replace(/\.(?=\d{3}(\D|$))/g, '').replace(/,/g, '.');
    if (!/^[\d.+\-*/()]+$/.test(e)) return NaN;
    try { const r = Function('"use strict";return (' + e + ')')(); return isFinite(r) ? Math.round(r * 1000) / 1000 : NaN; } catch (x) { return NaN; }
  }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isNaN(n) ? NaN : n;
}
// data: 1711 · 17/11 · 17/11/2026 · 17-11-26
function parseData(s, anno) {
  s = String(s ?? '').trim();
  let r = s.match(/^(\d{1,2})[\/\-. ](\d{1,2})(?:[\/\-. ](\d{2}|\d{4}))?$/), d, m, y = anno;
  if (r) { d = +r[1]; m = +r[2]; if (r[3]) y = r[3].length === 2 ? 2000 + +r[3] : +r[3]; }
  else if ((r = s.match(/^(\d{3,4})$/))) { const t = r[1].padStart(4, '0'); d = +t.slice(0, 2); m = +t.slice(2); }
  else if ((r = s.match(/^(\d{6}|\d{8})$/))) { d = +r[1].slice(0, 2); m = +r[1].slice(2, 4); y = r[1].length === 6 ? 2000 + +r[1].slice(4) : +r[1].slice(4); }
  else return null;
  if (!(m >= 1 && m <= 12 && d >= 1 && y)) return null;
  if (d > new Date(y, m, 0).getDate()) return null;
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

// ---------- regole del dominio ----------
const RE_LOTTO = /^((\d{2})?P\d+|\d{4,7})$/;                          // 26P123 oppure P1792; oppure lotto fornitore solo numerico (es. 22248, da Cerea)
const LINEE = { S: 'SV', F: 'FILMATO', T: 'TAGLIO LISCIO' };
const LINEE_OK = ['SV', 'FILMATO', 'TAGLIO LISCIO', 'PRETAGLIATO'];
const TL = 'TAGLIO LISCIO';
const FORMATI_FISSI = ['1KG', '2KG', '1/2', 'QUARTI', 'OTTAVI'];
const normFormato = v => {
  const s = String(v ?? '').trim().toUpperCase().replace(/\s+/g, ''), m = /^(\d+)(G|GR|GRAMMI)?$/.exec(s), k = /^(\d+)K(G)?$/.exec(s);
  if (m) return m[1] + 'G';                                          // 450 → 450G
  if (k) return k[1] + 'KG';                                         // 1k / 2kg → 1KG / 2KG
  if (s === 'O') return 'OTTAVI';                                    // o → ottavi
  if (s === 'Q') return 'QUARTI';                                    // q → quarti
  return s;
};
const grammi = f => { const m = /^(\d+)G$/.exec(f); return m ? +m[1] : null; };
const formatoOk = f => grammi(f) != null || FORMATI_FISSI.includes(f);
const PARAM_DEF = {
  PR: { calo: 0.391587048, segatura: 0.05, croste: 2.4, pulitura: 0.05, piallatura: 2.6, limite_croste_g: 500, peso_min: 35, peso_max: 45 },
  GP: { calo: 0.391587048, segatura: 0.05, croste: 2.4, pulitura: 0.05, piallatura: 2.6, limite_croste_g: 500, peso_min: 34, peso_max: 45, piatti_pct: 18 },
};

// ---------- stato ----------
const S = { prod: 'PR', page: 'lavaggi', user: null };
const PAR = { PR: { ...PARAM_DEF.PR }, GP: { ...PARAM_DEF.GP } };
const CODICI = { PR: {}, GP: {} };                // matricola → codice
const IMP = {};                                  // altre impostazioni (chiave → valore)
const REG = new Map();                           // lotto → registro lotti {matr,mese,anno,prodotto,arrivo} | null
const INFO = { PR: new Map(), GP: new Map() };   // lotto → {matr,mese,anno,media,n_righe,n_forme} | null
const CACHE = {};                                // 'tab|prod|mese' → Map data → {dati, altre}

// ---------- archivio locale (DEMO) ----------
const demoGet = k => { try { return JSON.parse(localStorage.getItem('dp_demo_' + k) || 'null'); } catch (e) { return null; } };   // solo modalità prova
const demoSet = (k, v) => localStorage.setItem('dp_demo_' + k, JSON.stringify(v));

const blocchi = (a, n = 200) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
const ok = r => { if (r.error) throw r.error; return r; };

// cache locale dei mesi chiusi (meno richieste)
const lsGet = k => { try { return JSON.parse(localStorage.getItem('dp:' + k) || 'null'); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('dp:' + k, JSON.stringify(v)); } catch (e) { /* pieno: pazienza */ } };
const lsDelPrefix = () => { try { Object.keys(localStorage).filter(k => k.startsWith('dp:')).forEach(k => localStorage.removeItem(k)); } catch (e) { } };

const DB = {
  async mese(tab, prod, mk) {                       // tutte le giornate del mese → Map data → {dati, altre}
    const ck = tab + '|' + prod + '|' + mk;
    if (CACHE[ck]) return CACHE[ck];
    let righe;
    const corrente = mk >= meseKey(isoOggi());
    if (DEMO) { const o = demoGet(tab) || {}; righe = Object.entries(o).filter(([k]) => k.startsWith(prod + '|' + mk)).map(([k, v]) => ({ data: k.split('|')[1], dati: v.dati, altre: v.altre || 0 })); }
    else {
      const loc = !corrente && lsGet(ck);
      if (loc) righe = loc;
      else {
        const sel = tab === 'dp_lavaggi' ? 'data,dati,altre' : 'data,dati';
        const r = ok(await sb.from(tab).select(sel).eq('prodotto', prod).gte('data', mk + '-01').lte('data', fineMese(mk)).order('data'));
        righe = r.data; if (!corrente) lsSet(ck, righe);
      }
    }
    const m = new Map(righe.map(x => [x.data, { dati: x.dati || [], altre: x.altre || 0 }]));
    CACHE[ck] = m; return m;
  },
  async salva(tab, prod, data, dati, altre) {
    const mk = meseKey(data), ck = tab + '|' + prod + '|' + mk;
    const vuotoGiorno = !dati.length && !(altre > 0);
    if (DEMO) {
      const o = demoGet(tab) || {}, k = prod + '|' + data;
      if (vuotoGiorno) delete o[k]; else o[k] = { dati, altre };
      demoSet(tab, o);
    } else if (vuotoGiorno) {
      ok(await sb.from(tab).delete().eq('prodotto', prod).eq('data', data));
    } else {
      const riga = { prodotto: prod, data, dati, aggiornato_il: new Date().toISOString() };
      if (tab === 'dp_lavaggi') riga.altre = altre || 0;
      ok(await sb.from(tab).upsert(riga));
    }
    if (CACHE[ck]) { if (vuotoGiorno) CACHE[ck].delete(data); else CACHE[ck].set(data, { dati, altre: altre || 0 }); }
    try { localStorage.removeItem('dp:' + ck); } catch (e) { }
  },
  async tutteImp() {
    if (DEMO) return demoGet('imp') || {};
    const r = ok(await sb.from('dp_impostazioni').select('chiave,valore')); const o = {}; r.data.forEach(x => o[x.chiave] = x.valore); return o;
  },
  async setImp(chiave, valore) {
    IMP[chiave] = valore;
    if (DEMO) { const o = demoGet('imp') || {}; o[chiave] = valore; demoSet('imp', o); return; }
    ok(await sb.from('dp_impostazioni').upsert({ chiave, valore, aggiornato_il: new Date().toISOString() }));
  },
  async tuttiCodici() {
    if (DEMO) return demoGet('codici') || [];
    const r = ok(await sb.from('dp_codici').select('prodotto,matricola,codice')); return r.data;
  },
  async setCodice(prod, matricola, codice) {
    CODICI[prod][matricola] = codice;
    if (DEMO) { const l = (demoGet('codici') || []).filter(x => !(x.prodotto === prod && x.matricola === matricola)); l.push({ prodotto: prod, matricola, codice }); demoSet('codici', l); return; }
    ok(await sb.from('dp_codici').upsert({ prodotto: prod, matricola, codice }));
  },
  async delCodice(prod, matricola) {
    delete CODICI[prod][matricola];
    if (DEMO) { demoSet('codici', (demoGet('codici') || []).filter(x => !(x.prodotto === prod && x.matricola === matricola))); return; }
    ok(await sb.from('dp_codici').delete().eq('prodotto', prod).eq('matricola', matricola));
  },
  async registro(lotti) {                           // Registro lotti (stesso database)
    if (!lotti.length) return [];
    if (DEMO) { try { return JSON.parse(localStorage.getItem('lav_demo_registro') || '[]').filter(x => lotti.includes(x.lotto)); } catch (e) { return []; } }
    const out = [];
    for (const b of blocchi(lotti, 150)) { const r = ok(await sb.rpc('lav_lotti_registro', { p_lotti: b })); out.push(...r.data); }
    return out;
  },
  async info(prod, lotti) {                         // media peso, matricola, mese/anno dai lavaggi (tutti gli anni)
    if (!lotti.length) return [];
    if (DEMO) {
      const o = demoGet('dp_lavaggi') || {}, m = new Map();
      Object.entries(o).filter(([k]) => k.startsWith(prod + '|')).forEach(([, v]) => (v.dati || []).forEach(r => {
        if (!lotti.includes(r.lotto)) return;
        const x = m.get(r.lotto) || { lotto: r.lotto, matr: r.matr, mese: r.mese, anno: r.anno, s: [], n_righe: 0, n_forme: 0 };
        if (num(r.forme)) x.s.push(num(r.sporco) / num(r.forme)); x.n_righe++; x.n_forme += num(r.forme); m.set(r.lotto, x);
      }));
      return [...m.values()].map(x => ({ ...x, media: x.s.length ? x.s.reduce((a, b) => a + b, 0) / x.s.length : null }));
    }
    const out = [];
    for (const b of blocchi(lotti, 150)) { const r = ok(await sb.rpc('dp_lotti_info', { p_prodotto: prod, p_lotti: b })); out.push(...r.data); }
    return out;
  },
  async lottiLavorazioni(prod, lotti, escludi) {
    if (!lotti.length) return [];
    if (DEMO) {
      const o = demoGet('dp_giornate') || {}, out = [];
      Object.entries(o).filter(([k]) => k.startsWith(prod + '|') && k.split('|')[1] !== escludi).forEach(([k, v]) => (v.dati || []).forEach(r => { if (lotti.includes(r.lotto)) out.push({ lotto: r.lotto, matr: r.matr, mese: r.mese, anno: r.anno, data: k.split('|')[1], riga: r.n }); }));
      return out;
    }
    const r = ok(await sb.rpc('dp_lotti_lavorazioni', { p_prodotto: prod, p_lotti: lotti, p_escludi: escludi }));
    return r.data;
  },
  async tutto(tab, prod) {                          // per il backup (a pagine da 1000)
    if (DEMO) { const o = demoGet(tab) || {}; return Object.entries(o).filter(([k]) => k.startsWith(prod + '|')).map(([k, v]) => ({ prodotto: prod, data: k.split('|')[1], ...v })); }
    const out = [];
    for (let i = 0; ; i += 1000) {
      const r = ok(await sb.from(tab).select('*').eq('prodotto', prod).order('data').range(i, i + 999));
      out.push(...r.data); if (r.data.length < 1000) break;
    }
    return out;
  },
  async scriviTutto(tab, righe) {
    if (DEMO) { const o = demoGet(tab) || {}; righe.forEach(x => { o[x.prodotto + '|' + x.data] = { dati: x.dati, altre: x.altre || 0 }; }); demoSet(tab, o); return; }
    for (const b of blocchi(righe, 50)) ok(await sb.from(tab).upsert(b.map(x => ({ prodotto: x.prodotto, data: x.data, dati: x.dati, ...(tab === 'dp_lavaggi' ? { altre: x.altre || 0 } : {}), aggiornato_il: x.aggiornato_il || new Date().toISOString() }))));
  },

// ---------- registro lotti e info lavaggi (con cache) ----------
const daRegistro = x => {                          // produzione "AGO-25" → mese 8, anno 2025
  const m = String(x.produzione || '').toLowerCase().match(/^([a-z]{3})-?(\d{2})$/);
  return { matr: normMatr(x.matricola), mese: m ? (MESI.indexOf(m[1]) + 1 || null) : null, anno: m ? 2000 + +m[2] : null, arrivo: x.data_arrivo, prodotto: x.prodotto || '' };
};
async function caricaRegistro(lotti) {
  const nuovi = [...new Set(lotti.filter(l => RE_LOTTO.test(l) && !REG.has(l)))];
  if (!nuovi.length) return;
  try {
    const r = await DB.registro(nuovi);
    nuovi.forEach(l => REG.set(l, null));
    r.forEach(x => { if (!REG.get(x.lotto)) REG.set(x.lotto, daRegistro(x)); });
  } catch (e) { toast('Registro lotti non raggiungibile: ' + (e.message || e), true); }
}
async function caricaInfo(prod, lotti) {
  const nuovi = [...new Set(lotti.filter(l => l && !INFO[prod].has(l)))];
  if (!nuovi.length) return;
  try {
    const r = await DB.info(prod, nuovi);
    nuovi.forEach(l => INFO[prod].set(l, null));
    r.forEach(x => INFO[prod].set(x.lotto, { matr: normMatr(x.matr), mese: x.mese, anno: x.anno, media: x.media == null ? null : +x.media, n_righe: +x.n_righe, n_forme: +x.n_forme }));
  } catch (e) { toast('Lettura lavaggi non riuscita: ' + (e.message || e), true); }
}
const infoLotto = (prod, l) => INFO[prod].get(l) || null;

// ---------- calcoli ----------
const par = () => PAR[S.prod];
const SENZA_MATR = ['BON', 'GRAN BON', 'RETINATO', 'SBIANCATO'];       // per questi codici matricola e mese/anno non sono obbligatori
const senzaMatr = (prod, r) => SENZA_MATR.includes(String(codiceDi(prod, r)).toUpperCase());
const codiceMatr = (prod, matr) => { const m = normMatr(matr), t = CODICI[prod]; if (t[m] !== undefined) return t[m]; const k = Object.keys(t).find(x => normMatr(x) === m); return k !== undefined ? t[k] : ''; };
const codiceDi = (prod, r) => r.cod ? r.cod : codiceMatr(prod, r.matr);
function stagionatura(dataIso, mese, anno) {
  if (!dataIso || !mese || !anno) return null;
  const d = new Date(+dataIso.slice(0, 4), +dataIso.slice(5, 7) - 1, +dataIso.slice(8, 10)); const ieri = new Date(d.getTime() - 86400000);
  return (ieri.getFullYear() - anno) * 12 + (d.getMonth() + 1) - mese - 1;
}
function calcLavaggio(prod, r) {
  const p = PAR[prod], f = num(r.forme), s = num(r.sporco);
  return { medio: f ? s / f : null, pulito: s ? mround(s - s * p.calo / 100) : null, codice: codiceDi(prod, r) };
}
function calcLavorazione(prod, dataIso, r) {
  const p = PAR[prod], f = num(r.forme), inf = infoLotto(prod, r.lotto);

  $('b-exp').onclick = async () => {
    $('b-es').textContent = ' Preparo il file…';
    try {
      const out = { versione: 1, creato: new Date().toISOString(), impostazioni: await DB.tutteImp(), codici: await DB.tuttiCodici(), giornate: [], lavaggi: [] };
      for (const pr of ['PR', 'GP']) { out.giornate.push(...await DB.tutto('dp_giornate', pr)); out.lavaggi.push(...await DB.tutto('dp_lavaggi', pr)); }

        let mk = '2025-12'; const fine = meseKey(isoOggi());
        while (mk <= fine) {
          const mappa = await DB.mese(tab, S.prod, mk);
          const lotti = [...new Set([...mappa.values()].flatMap(g => g.dati.filter(r => r.lotto && (vuoto(r.matr) || vuoto(r.mese) || vuoto(r.anno)) && !(tab === 'dp_lavaggi' && senzaMatr(S.prod, r))).map(r => r.lotto)))];
          if (lotti.length) {
            await caricaRegistro(lotti); if (tab === 'dp_giornate') await caricaInfo(S.prod, lotti);
            for (const [data, g] of mappa) {
              let mod = false;
              g.dati.forEach(r => {
                if (!r.lotto || !(vuoto(r.matr) || vuoto(r.mese) || vuoto(r.anno)) || (tab === 'dp_lavaggi' && senzaMatr(S.prod, r))) return;
                const reg = REG.get(r.lotto), inf = tab === 'dp_giornate' ? infoLotto(S.prod, r.lotto) : null, d = inf && inf.matr ? inf : reg;
                if (!d) { restano.add(r.lotto); return; }
                ['matr', 'mese', 'anno'].forEach(f => { if (vuoto(r[f]) && !vuoto(d[f])) { r[f] = d[f]; mod = true; cambiate++; } });
              });
              if (mod) { await DB.salva(tab, S.prod, data, g.dati, g.altre); giorni++; }
            }
          }
          mk = meseAdd(mk, 1);

    } catch (e) { out.innerHTML = `<span class="errbox">Errore: ${esc(e.message || e)}</span>`; }
  };
  $('b-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const b = JSON.parse(await f.text()); if (!b.giornate || !b.lavaggi) throw new Error('File non valido');

      $('b-imp').textContent = 'Importo…';
      await DB.scriviTutto('dp_lavaggi', b.lavaggi); await DB.scriviTutto('dp_giornate', b.giornate);

      for (const [k, v] of Object.entries(b.impostazioni || {})) { await DB.setImp(k, v); if (k.startsWith('param_')) PAR[k.slice(6)] = { ...PARAM_DEF[k.slice(6)], ...v }; }
      Object.keys(CACHE).forEach(k => delete CACHE[k]); lsDelPrefix(); INFO.PR.clear(); INFO.GP.clear();
      $('b-imp').innerHTML = '<span class="okbox">Backup importato.</span>';
    } catch (x) { $('b-imp').innerHTML = `<span class="errbox">Errore: ${esc(x.message || x)}</span>`; }
  };
}

async function trovaRiga(prod, n) {

  const r = ok(await sb.rpc('dp_riga_lavorazione', { p_prodotto: prod, p_n: n })); return r.data && r.data[0] ? { data: r.data[0].data, riga: r.data[0].riga } : null;
}
async function trovaRighe(prod, lo, hi) {                 // righe con numero tra lo e hi, qualunque sia la data
  if (DEMO) { const o = demoGet('dp_giornate') || {}, out = []; for (const [k, v] of Object.entries(o)) { if (!k.startsWith(prod + '|')) continue; (v.dati || []).forEach(r => { const n = num(r.n); if (n >= lo && n <= hi) out.push({ data: k.split('|')[1], riga: r }); }); } return out.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : num(a.riga.n) - num(b.riga.n))); }
  const r = ok(await sb.rpc('dp_righe_lavorazione', { p_prodotto: prod, p_da: lo, p_a: hi })); return (r.data || []).map(x => ({ data: x.data, riga: x.riga }));
}

}

// Costruisce un foglio "elenco" dagli spec colonna: { l, w, hf (colore titolo), df (colore dati), db (grassetto dati), al, f (formato), v: r => valore, tot: chiave del totale }
function foglioElenco(nome, titolo, spec, righe, totali, opz) {
  const sz = opz.sz || 11, hH = opz.hH, rH = opz.rH, bd = true;
  const hs = c => ({ b: 1, sz, al: 'center', va: 'center', wrap: 1, bd, fill: c.hf });
  const out = [[{ v: titolo, s: { b: 1, sz, fill: opz.titFill } }], spec.map(c => ({ v: c.l, s: hs(c) }))];
  righe.forEach(r => out.push(spec.map(c => ({ v: c.v(r), s: { f: c.f, sz, al: c.al, va: 'center', bd, b: c.db, fill: c.df } }))));
  if (totali) out.push(spec.map((c, i) => ({ v: c.tot ? nv(totali[c.tot]) : (i === opz.etTot ? 'TOTALE' : ''), s: { f: c.tot ? c.f : 0, sz, b: 1, al: c.tot ? undefined : 'center', va: 'center', bd } })));
  const rowH = { 0: opz.titH || 20, 1: hH }; if (rH) for (let i = 2; i < out.length; i++) rowH[i] = rH;
  return { nome, righe: out, cols: spec.map(c => ({ w: c.w })), rowH, freeze: 2, repeat: 2, fit: true, margins: opz.margins, scale: opz.scale };
}

// ---- SCHEDA CONSORZIO (Grana Padano): un foglio per ogni scheda da 15 righe, stesso disegno di NUOVA SCHEDA CONSORZIO ----
function xlSchedeConsorzio(righe, note, nome) {
  const B = { sz: 12, al: 'center', va: 'center', bd: true }, H = { ...B, b: 1, wrap: 1 }, vuota = () => ({ v: '', s: B });
  const n = Math.max(1, Math.ceil(righe.length / 15)), fogli = [];
  for (let p = 0; p < n; p++) {
    const pr = righe.slice(p * 15, p * 15 + 15), rr = Array.from({ length: 27 }, () => []);
    rr[0][10] = { v: 'TRENTIN SPA', s: { b: 1, sz: 10, al: 'left' } }; rr[1][10] = { v: 'PEGOGNAGA (MN)', s: { b: 1, sz: 10, al: 'left' } };
    const h1 = ['N.', 'DATA', 'LAVORAZIONE', '', 'LOTTO', 'NUMERO FORME', 'MATR.', 'MESE E ANNO', 'PESO', 'PESO', 'SFRIDI (KG)', 'NOTE'], h2 = ['', '', 'PESO', 'TIPO', '', '', '', '', 'INIZIALE (KG)', 'FINALE (KG)', '', ''];
    h1.forEach((v, i) => rr[9][i] = { v, s: H }); h2.forEach((v, i) => rr[10][i] = { v, s: H });
    for (let i = 0; i < 15; i++) {
      const r = pr[i], R = rr[11 + i];
      const cel = [r ? numOrTxt(r.n) : '', r ? serData(r.data) : '', r ? (r.fmt || '') : '', r ? (r.tipo || '') : '', r ? (r.lotto || '') : '', r ? nv(r.forme) : '', r ? numOrTxt(r.matr) : '', r ? serMese(r.mm) : '', r ? nv(r.iniz) : '', r ? nv(r.fin) : '', r ? nv(r.sfridi) : '', r ? (note[p * 15 + i] || '') : ''];
      const fm = [FMT_X.n0, FMT_X.data, FMT_X.text, 0, FMT_X.n0, 0, 0, FMT_X.mmmmyy, FMT_X.kg2, FMT_X.kg2, FMT_X.kg2, 0];
      cel.forEach((v, c) => R[c] = { v, s: { ...B, f: fm[c], b: c === 11 ? 1 : 0 } });
    }
    const R = rr[26]; for (let c = 0; c < 12; c++) R[c] = vuota();
    R[8] = { v: 'TOTALE SFRIDI', s: { ...B, b: 1 } }; R[10] = { v: nv(pr.reduce((a, r) => a + (+r.sfridi || 0), 0)), s: { ...B, b: 1, f: FMT_X.kg2 } };
    const rowH = { 0: 22.5, 26: 33 }; for (let i = 9; i <= 25; i++) rowH[i] = 15.75;
    const w = [6.7, 11.9, 11.4, 17.6, 9.1, 11.1, 9.1, 15, 13.9, 13.6, 10.1, 10.1];
    fogli.push({ nome: n > 1 ? `Scheda ${p + 1}` : 'NUOVA SCHEDA CONSORZIO', righe: rr, cols: w.map(x => ({ w: x })), rowH, merges: ['A10:A11', 'B10:B11', 'C10:D10', 'E10:E11', 'F10:F11', 'G10:G11', 'H10:H11', 'L10:L11', 'C27:D27', 'I27:J27'], margins: [0.315, 0.315, 0.748, 0.748] });
  }
  scarica(xlsxFormato(fogli), nome + '.xlsx');
}

function pgPresto() { $('main').innerHTML = '<div class="empty">Pagina in preparazione.</div>'; }
function disegnaMenu() {
  $('tabs').innerHTML = MENU().map(m => m.t ? `<div class="nav-title">${m.t}</div>` : `<button class="tab-btn ${S.page === m.id ? 'active' : ''}" data-p="${m.id}">${m.n}</button>`).join('');

async function vai(id) {
  if (ELENCO.mod.size) return toast('Ci sono modifiche non salvate nell\'elenco: salvale o annullale', true);
  if (CUR.dirty && V[CUR.tipo] === 'giorno' && (S.page === 'lavaggi' || S.page === 'lavorazioni')) { const r = await chiediSalvataggio(); if (r === 'annulla') return; }
  if ((id === 'lavaggi' || id === 'lavorazioni') && S.page !== id) V[id] = 'elenco';          // arrivando da un'altra pagina si apre l'elenco, già in fondo
  const m = MENU().find(x => x.id === id) || MENU().find(x => x.id); S.page = m.id; try { sessionStorage.setItem('dp_page', S.page); } catch (e) { }
  CUR.tipo = null; CUR.dirty = false; nascondiSomma(); nascondiTip(); disegnaMenu(); window.scrollTo(0, 0);
  $('main').innerHTML = '<div class="empty">Carico…</div>';
  try { await m.f(); } catch (e) { console.error(e); $('main').innerHTML = `<div class="errbox" style="margin:20px">Errore: ${esc(e.message || e)}</div>`; }
}
async function cambiaProdotto(p) {
  if (p === S.prod) return;
  if (CUR.dirty && (S.page === 'lavaggi' || S.page === 'lavorazioni')) { const r = await chiediSalvataggio(); if (r === 'annulla') return; }
  S.prod = p; try { localStorage.setItem('dp_prod', p); } catch (e) { }
  CUR.tipo = null; CUR.dirty = false;
  if (!MENU().find(x => x.id === S.page)) S.page = 'lavaggi';
  await vai(S.page);
}
async function caricaBase() {
  const [imp, cod] = await Promise.all([DB.tutteImp(), DB.tuttiCodici()]);
  Object.assign(IMP, imp);
  ['PR', 'GP'].forEach(p => { PAR[p] = { ...PARAM_DEF[p], ...(imp['param_' + p] || {}) }; CODICI[p] = {}; });
  cod.forEach(c => { CODICI[c.prodotto][normMatr(c.matricola)] = c.codice; });
}
async function avviaApp() {
  $('login').hidden = true; $('app').hidden = false;
  $('btn-esci').hidden = DEMO; $('demo-badge').hidden = !DEMO;
  try { S.prod = localStorage.getItem('dp_prod') === 'GP' ? 'GP' : 'PR'; } catch (e) { }
  try { await caricaBase(); } catch (e) { toast('Lettura dati non riuscita: ' + (e.message || e), true); }
  const p = (() => { try { return sessionStorage.getItem('dp_page'); } catch (e) { return null; } })();
  S.page = MENU().find(x => x.id === p) ? p : 'lavaggi';
  await vai(S.page);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) vai(b.dataset.p); });
$('prodsel').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) cambiaProdotto(b.dataset.p); });
$('btn-azzera').addEventListener('click', azzeraSelezioni);
$('btn-aggiorna').addEventListener('click', async () => {
  if (CUR.dirty) return toast('Salva prima la giornata aperta', true);
  Object.keys(CACHE).forEach(k => delete CACHE[k]); lsDelPrefix(); INFO.PR.clear(); INFO.GP.clear(); REG.clear();
  try { await caricaBase(); } catch (e) { }
  await vai(S.page); toast('Dati aggiornati');
});
$('btn-esci').addEventListener('click', async () => { if (sb) await sb.auth.signOut(); location.reload(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { chiudiModal(); chiudiFiltroPop(); azzeraSelezioni(); } });
(async function avvia() {
  if (DEMO) return avviaApp();
  const { data } = await sb.auth.getSession();
  if (data.session && String(data.session.user.email).toLowerCase() === EMAIL_PAOLO) return avviaApp();
  $('login').hidden = false; $('login-pw').focus();
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault(); $('login-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: EMAIL_PAOLO, password: $('login-pw').value });
    if (error) { $('login-err').textContent = 'Password errata'; return; }
    avviaApp();
  });
})();
